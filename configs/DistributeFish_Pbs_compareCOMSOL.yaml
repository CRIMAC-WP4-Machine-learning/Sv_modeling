# Parameters for scripts/DistributeFish_Pbs_compareCOMSOL.py
# Coordinates: z is up, so targets below the echosounder have negative z.

description: Fixed 4-target configuration at 50 m compared with the FEM-BEM (COMSOL) solution

transmit_signal:                    # FM sweep; plotted and its energy printed, not used in the backscatter sum
  effective_duration_ms: 2.048      # sweep duration (2 x 1.024 ms)
  center_time_ms: 10.24             # 10 x 1.024 ms
  total_duration_ms: 12.288         # whole signal incl. zeros (12 x 1.024 ms)
  sampling_rate_hz: 8388608         # 512*512*16*2
  f_start_hz: 160000
  f_end_hz: 260000
  ramp_exponent: 25                 # fast ramping; smaller value = slower ramp

echosounder:
  position_m: [0.0, 0.0, 0.0]

school:
  geometry: fixed
  # Must match the geometry the FEM-BEM file was computed for.
  points_m:
    - [0.0, 0.0, -50.0]
    - [0.0, 0.0, -50.1]
    - [0.0, 0.0, -50.25]
    - [0.0, -0.25, -50.25]
  theta_deg: [0.0, 0.0, 0.0, 0.0]   # azimuth in XY plane from +X
  phi_deg: [90.0, 90.0, 90.0, 90.0] # polar angle from +Z; all horizontal along +X

fembem:
  # File in data/fembem/. Its name is also used for the output figure names.
  file: FEM_BEM_II_FourTargets_TS_a1cm_b4mm_rho7p34_90deg_D1_0p1m_D2_0p25m_D3_z0p25m_x0p25m.txt
