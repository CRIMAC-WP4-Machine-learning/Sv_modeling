[project]
name = "sv-modeling"
version = "0.1.0"
description = "Simulation of acoustic backscatter from fish aggregations and estimation of the volume backscattering coefficient (s_v)"
readme = "README.md"
authors = [
    { name = "Babakkhodabandeloo", email = "khodabandeloo.babak@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib==3.11.1",
    "numpy==2.5.3",
    "pandas==3.0.5",
    "scipy==1.18.1",
]

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
